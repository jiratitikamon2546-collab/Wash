<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>AR Washing Machine - Fixed Ready to Use</title>
    <!-- ใช้เวอร์ชันเดียวกับตัวอย่าง Marker ของ AR.js -->
    <script src="https://aframe.io"></script>
    <script src="https://githack.com"></script>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #ui {
            position: fixed;
            z-index: 9999;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            width: min(330px, 88vw);
            box-sizing: border-box;
            padding: 14px;
            background: rgba(0, 0, 0, .78);
            color: #fff;
            border-radius: 18px;
            text-align: center;
        }
        #rpm {
            font-size: 24px;
            font-weight: bold;
            margin: 5px 0 8px;
        }
        button {
            width: 68px;
            height: 48px;
            margin: 3px;
            border: 0;
            border-radius: 12px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        #status {
            font-size: 14px;
            margin-top: 7px;
        }
        #help {
            font-size: 12px;
            opacity: .85;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <a-scene embedded vr-mode-ui="enabled:false" renderer="antialias:true; alpha:true; precision:medium" 
             arjs="sourceType:webcam; detectionMode:mono; matrixCodeType:3x3; debugUIEnabled:false">
        
        <!-- ใช้ Hiro Marker มาตรฐานของ AR.js -->
        <a-marker id="hiroMarker" preset="hiro" emitevents="true" smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="5">
            
            <!-- ตัวโครงเครื่องซักผ้าหลัก -->
            
                
                <!-- ตัวเครื่องหลัก -->
                <a-box position="0 0.725 0" width="1.25" height="1.45" depth="0.85" color="#eeeeee"></a-box>
                
                <!-- แผงด้านบน -->
                <a-box position="0 1.25 0.435" width="1.05" height="0.32" depth="0.035" color="#d7d7d7"></a-box>
                
                <!-- ช่องใส่ผงซักฟอก -->
                <a-box position="-0.35 1.25 0.455" width="0.25" height="0.10" depth="0.025" color="#aaaaaa"></a-box>
                
                <!-- ปุ่มหมุน (แก้ไขหมุนหน้า 90 0 0 เพื่อหันวงกลมเข้าหากล้อง) -->
                <a-cylinder position="0.03 1.25 0.46" radius="0.095" height="0.035" rotation="90 0 0" color="#555555"></a-cylinder>
                
                <!-- จอแสดงผล -->
                <a-box position="0.34 1.25 0.455" width="0.25" height="0.12" depth="0.025" color="#222222"></a-box>
                
                <!-- ขอบประตูเครื่อง (แก้ไขมุมหมุนเป็น 90 0 0 เพื่อให้เห็นเป็นวงกลมตรงหน้า) -->
                <a-cylinder position="0 0.68 0.43" radius="0.39" height="0.045" rotation="90 0 0" color="#555555"></a-cylinder>
                
                <!-- ถังซักด้านในที่จะหมุน (แก้ไขมุมหมุนตั้งต้นเป็น 90 0 0) -->
                <a-cylinder id="drum" position="0 0.68 0.44" radius="0.31" height="0.04" rotation="90 0 0" color="#202830"></a-cylinder>
                
                <!-- กระจกฝาหน้าเครื่อง (แก้ไขมุมหมุนเป็น 90 0 0 และปรับให้อมฟ้าใส) -->
                <a-cylinder position="0 0.68 0.455" radius="0.245" height="0.02" rotation="90 0 0" color="#6f8790" opacity="0.6"></a-cylinder>
                
                <!-- ฐานเครื่อง -->
                <a-box position="0 0.025 0" width="1.3" height="0.05" depth="0.9" color="#bbbbbb"></a-box>
                
            
            
        </a-marker>
        
    </a-scene>

    <div id="ui">
        <div>ความเร็วรอบถังซัก</div>
        <div id="rpm">0 RPM</div>
        <button onclick="changeRPM(-100)">−</button>
        <button onclick="changeRPM(100)">+</button>
        <div id="status">กำลังรอ Hiro Marker...</div>
        <div id="help">ช่วง 0–1200 RPM</div>
    </div>

    <script>
        const marker = document.getElementById("hiroMarker");
        const drum = document.getElementById("drum");
        const rpmText = document.getElementById("rpm");
        const statusText = document.getElementById("status");
        let rpm = 0;

        function changeRPM(value) {
            rpm = Math.max(0, Math.min(1200, rpm + value));
            rpmText.textContent = rpm + " RPM";
        }

        let lastTime = performance.now();
        function animate(now) {
            const dt = (now - lastTime) / 1000;
            lastTime = now;

            if (rpm > 0) {
                // คำนวณองศาที่เพิ่มขึ้นตามเวลาจริง (dt)
                const degPerSec = (rpm * 360) / 60;
                const deltaRotation = degPerSec * dt;

                // ดึงค่าการหมุนปัจจุบัน
                let currentRot = drum.getAttribute("rotation");
                
                // สำหรับทรงกระบอกที่หันหน้าตรง (90 0 0) จะต้องเพิ่มมุมหมุนที่แกน Z เพื่อให้หมุนปั่นเป็นวงกลมหน้าเครื่อง
                currentRot.z += deltaRotation;
                
                // อัปเดตองศากลับไปที่ตัวถังซัก
                drum.setAttribute("rotation", currentRot);
            }
            requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);

        marker.addEventListener("markerFound", () => {
            statusText.textContent = "✓ พบ Marker แล้ว";
        });
        marker.addEventListener("markerLost", () => {
            statusText.textContent = "กำลังรอ Hiro Marker...";
        });
    </script>
</body>
</html>
