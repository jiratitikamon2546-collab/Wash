<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AR Washing Machine - Fixed</title>

<!-- ใช้เวอร์ชันเดียวกับตัวอย่าง Marker ของ AR.js -->
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif}
#ui{
  position:fixed;z-index:9999;left:50%;bottom:18px;transform:translateX(-50%);
  width:min(330px,88vw);box-sizing:border-box;padding:14px;
  background:rgba(0,0,0,.78);color:#fff;border-radius:18px;text-align:center;
}
#rpm{font-size:24px;font-weight:bold;margin:5px 0 8px}
button{width:68px;height:48px;margin:3px;border:0;border-radius:12px;
       font-size:28px;font-weight:bold;cursor:pointer}
#status{font-size:14px;margin-top:7px}
#help{font-size:12px;opacity:.85;margin-top:5px}
</style>
</head>

<body>

<a-scene
  embedded
  vr-mode-ui="enabled:false"
  renderer="antialias:true; alpha:true; precision:medium"
  arjs="sourceType:webcam; detectionMode:mono; matrixCodeType:3x3; debugUIEnabled:false">

  <!-- ใช้ Hiro Marker มาตรฐานของ AR.js -->
  <a-marker
    id="hiroMarker"
    preset="hiro"
    emitevents="true"
    smooth="true"
    smoothCount="5"
    smoothTolerance="0.01"
    smoothThreshold="5">

    <!-- ยกโมเดลขึ้นจากผิว Marker -->
    <a-entity id="machine" position="0 0.05 0">

      <!-- ตัวเครื่อง -->
      <a-box position="0 0.72 0"
             width="1.25" height="1.45" depth="0.85"
             color="#eeeeee"></a-box>

      <!-- แผงด้านบน -->
      <a-box position="0 1.25 0.435"
             width="1.05" height="0.32" depth="0.035"
             color="#d7d7d7"></a-box>

      <!-- ช่องใส่ผงซักฟอก -->
      <a-box position="-0.35 1.30 0.465"
             width="0.25" height="0.10" depth="0.025"
             color="#aaaaaa"></a-box>

      <!-- ปุ่มหมุน -->
      <a-cylinder position="0.03 1.31 0.48"
                   radius="0.095" height="0.035"
                   rotation="90 0 0"
                   color="#555555"></a-cylinder>

      <!-- จอ -->
      <a-box position="0.34 1.30 0.465"
             width="0.25" height="0.12" depth="0.025"
             color="#222222"></a-box>

      <!-- ประตู -->
      <a-cylinder position="0 0.68 0.47"
                   radius="0.39" height="0.045"
                   rotation="90 0 0"
                   color="#555555"></a-cylinder>

      <a-cylinder id="drum"
                   position="0 0.68 0.495"
                   radius="0.31" height="0.055"
                   rotation="90 0 0"
                   color="#202830"></a-cylinder>

      <!-- กระจกประตู -->
      <a-cylinder position="0 0.68 0.53"
                   radius="0.245" height="0.02"
                   rotation="90 0 0"
                   color="#6f8790"
                   opacity="0.9"></a-cylinder>

      <!-- ฐาน -->
      <a-box position="0 0.025 0"
             width="1.3" height="0.05" depth="0.9"
             color="#bbbbbb"></a-box>

    </a-entity>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<div id="ui">
  <div>ความเร็วรอบถังซัก</div>
  <div id="rpm">0 RPM</div>
  <button onclick="changeRPM(-100)">−</button>
  <button onclick="changeRPM(100)">+</button>
  <div id="status">กำลังรอ Hiro Marker...</div>
  <div id="help">ช่วง 0–1200 RPM</div>
</div>

<script>
const marker = document.getElementById("hiroMarker");
const machine = document.getElementById("machine");
const drum = document.getElementById("drum");
const rpmText = document.getElementById("rpm");
const statusText = document.getElementById("status");

let rpm = 0;

function changeRPM(value){
  rpm = Math.max(0, Math.min(1200, rpm + value));
  rpmText.textContent = rpm + " RPM";
}

// หมุนเฉพาะ "ถังซัก" ไม่หมุนทั้งเครื่อง
let lastTime = performance.now();

function animate(now){
  const dt = (now - lastTime) / 1000;
  lastTime = now;

  // RPM -> degree/sec
  const degPerSec = rpm * 360 / 60;

  const rot = drum.getAttribute("rotation") || {x:90,y:0,z:90};
  rot.z += degPerSec * dt;
  drum.setAttribute("rotation", rot);

  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

marker.addEventListener("markerFound", () => {
  statusText.textContent = "✓ พบ Marker แล้ว";
});

marker.addEventListener("markerLost", () => {
  statusText.textContent = "กำลังรอ Hiro Marker...";
});
</script>

</body>
</html>
